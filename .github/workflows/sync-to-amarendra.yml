name: Sync Nhealth to Amarendra

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Amarendra GitHub
        uses: repo-sync/github-sync@v2
        with:
          destination_repo: "https://github.com/amarendrai443/repo-name.git"
          destination_branch: "main"
          github_token: ${{ secrets.AMARENDRAI443_PAT }}
