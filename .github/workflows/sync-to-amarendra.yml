name: Sync Nhealth to Amarendra

on:
  push:
    branches:
      - main  # Mee main branch name 'master' aithe 'master' ani marchandi

jobs:
  git-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Amarendra GitHub
        uses: repo-sync/github-sync@v2
        with:
          destination_repo: "https://github.com/amarendra-username/amarendra-repo-name.git"
          destination_branch: "main"
          github_token: ${{ secrets.AMARENDRA_PAT }}
