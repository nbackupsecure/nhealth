name: Sync Nhealth to Amarendra

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Target Repository
        env:
          PAT_TOKEN: ${{ secrets.AMARENDRAI443_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add target https://amarendrai443:${PAT_TOKEN}@github.com/amarendrai443/nhealthsync.git
          git push target main --force
