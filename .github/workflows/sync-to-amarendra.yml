name: Sync Nhealth to Amarendra

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Amarendra GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add amarendra https://x-access-token:${{ secrets.AMARENDRAI443_PAT }}@github.com/amarendrai443/nhealthsync.git
          git push amarendra main --force
